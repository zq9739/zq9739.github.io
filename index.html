const SYSTEM_DATA = {"projectTitle":"《决战破晓》第一季","scriptSources":[{"start":1,"end":10,"label":"EP01—10 台词优化稿 2.0","filename":"决战破晓_第01-10集_优化版2.0.docx","preface":["决战破晓 前十集台词优化稿","项目类型： 重生、游戏创业、现实商战、高手群像爽剧；竖屏漫剧。","一句话介绍： 林辰重生回2002年，带领被埋没的游戏高手独立创业，把敌人的围剿变成自己的生意，把玩家的热爱变成一个由自己掌舵的游戏商业帝国。","项目梗概： 《决战破晓》公测爆火后，林辰租下店面，招揽老周、阿凯、小苏和许明。天穹先收购、断供、压渠道，再借卧底许明制造公开围剿。林辰始终掌握许明的来路，真实兑现他的贡献，同时把核心技术、备用服务与新渠道握在手中，等对手花完钱、公开认领盗用素材，再一举反攻。首战之后，林辰开放自主公会和跨公会合作。天穹企图用各种手段抢夺资源彻底做掉林辰，林辰亲自用实力、规则与服务拆掉他的控制，让普通玩家获得自己组织、自己获胜的机会。","人物小传（暂定）：","林辰： 重生的游戏制作人。主玩剑武士，精通四职业，是全队最强操作者与指挥者。说话简短，决定先落实到钱、人和安排，再等敌人出手。对元老兑现待遇，对玩家尊重选择，对敌人不留经营上的退路。","老周： 枪械师高手。妻离子散的倒霉中年大叔，曾替旧公司背技术事故责任，如今靠修电脑谋生。负责研发、服务器与设备，话少，认结果。林辰给他决定技术与预算的权力。","阿凯： 魔法师高手。擅长视觉、角色与空间设计，作品曾被上司抢署名。嘴硬、手稳，最在意作品上能不能留下自己的名字，外冷内热的闷葫芦，一位漂在他乡的乡下奋斗青年。","小苏： 格斗师高手。原本在投诉岗位替别人收拾残局，懂玩法，也懂玩家为什么留下。负责玩家运营与组织，善于当场指出对方话里的漏洞，父亲是泰拳拳王，从小就深得武术精髓。","许明： 枪械师高手，善于游击、诱敌和渠道谈判。天穹预先派来的卧底，也是实实在在做出成绩的初创元老。林辰从一开始便知道他的身份，对其贡献照常奖励；许明直到第10集才知道自己一直被看透。","许总、朴总： 天穹游戏高层。许总习惯用资金、身份与渠道压人；朴总负责执行收买、封锁与渗透。两人把利益当作一切关系的价格，背后发家史只写着吃人两字。","铁头： 连锁网吧巨头，讲生意也讲义气，是林辰早期渠道伙伴。后来发起燎原公会，愿意给新人机会。","阿野： 二十二岁的送货员，游戏操作有天赋，因上线时间不固定被大公会排斥。","烈刃： 前世界冠军队伍队员，欧阳世家的小女，目前排名前十游戏公会会长，有超一流实战水平，只佩服比自己强的人。前期林辰最强后台","叶宁： 外部律师。核对合同、开发留存和资料流转，帮助林辰把能说明事实的材料固定下来。","版本与时长：第一集保留已有样片文字；第二至十集已直接优化过长、重复和拗口的台词，保留原剧情、人物动机、商业条件与伏笔。动作及场次不变，原始文件另存不动。正常速度每集以2分50秒为上限，分镜需将对白、表演、打斗与转场共同核时；本稿尚未完整配音实测。详细改句见随附修改对照。"],"sceneCount":44,"lineCount":571},{"start":11,"end":30,"label":"EP11—30 分场剧本","filename":"第11集——第30集剧本 决战破晓.docx","preface":["《决战破晓》第11—30集详细剧本","项目类型： 游戏创业、现实商战、重生复仇、高手群像爽剧；以现实竞争为主，游戏对抗兑现实力，人物相处保留轻喜剧与感情温度。","一句话介绍： 林辰带着被低估的游戏高手，打穿资本对赛事、作品和发行的控制，在一次次真实交易与胜局中，把小公司做成自己的游戏商业帝国。","项目梗概： 林辰开放玩家自主建会，化解玄狼以公会名册逼宫，带伙伴在交流战中证明实力。天穹转向线下打砸与渠道围堵，团队依靠提前训练和接应守住公司，公会成长为职业赛事的基础。随后，天穹砸场、逼签、抢明星，林辰用已落实的门店和职业体系接招，让普通玩家拿到参赛机会、工资和冠军。联赛由假赛和外挂风波走向真正的决赛，公司也由收款走向元老分股。随后，冠军与四职业成为正版商品、主题门店和动画，资本将争夺转向署名、货品、渠道、服务及游戏经济。林辰守住产品与经营，让伙伴有权决定作品和预算。伙伴的私人生活却没有自动变好：老周因回避伤害沈芸，阿凯必须拒绝利用旧情索取署名的人，小苏学习接受接应，铁头重新找到自己在队伍中的位置。创作工具开放后，普通人的地图成为能署名、能分账的内容，多游戏发行及海外试点随之落地。天穹的失败成本和欠款终于反噬雇主，林辰在峰会反击后继续完成开服、交付和回款；旧巨头进入清算，被放弃的研发团队获得新机会。数年后，伙伴共同掌握新集团的决定权，游戏依旧是事业的最大板块。","人物小传：","林辰： 重生制作人，精通四职业，主用剑武士。最强的不仅是临场实力，还有提前布置产品、人员和经营筹码的能力。厚待伙伴，允许他们自己赢，也能坦然回应烈刃的偏爱；不替伙伴决定私人关系。","老周： 枪械师、技术负责人。习惯先照顾别人，遇到机器故障敢负责，遇到自己的感情却怕给人添麻烦。事业中从背锅者成为签预算的人，爱情中要学会承认、道歉和守约。","阿凯： 魔法师、美术与内容负责人。曾被夺走署名，寡言而敏感，嘴上不肯讨好，手里肯替人多做一步。夺回自己的名字后，也开始保护共同创作者的名字。","小苏： 格斗师、玩家与赛事运营负责人，父亲为泰拳拳王。护人时快，容易把照顾变成替人决定；受伤后逐渐愿意交接工作，让保护成为团队的事。","铁头： 连锁网吧经营者、燎原发起人。有钱、有渠道，也怕职业队不再需要自己。愿意出资而不买走成员，最终发现自己被留下并不只是因为钱。","阿野、阿诚： 阿野是送货员出身的枪械师，从怕解释到敢带队；阿诚从被吞奖励的普通成员成长为愿意自主担当的伙伴，记得台前胜利背后没被看见的人。","烈刃： 欧阳家小女、前世界冠军队成员、独立队伍负责人。好胜、直接，喜欢林辰，却不靠关系换资格。面对公平的失败仍有尊严，商业与感情都由自己决定。","沈芸： 三十岁舞者兼演出后勤。早年被恋人抛下后独自谋生，珍惜工作，也希望私人关系被认真承认。照顾老周不是接受含糊关系；愿意重新相处，也保留外地演出的职业选择。","陈默、叶宁： 陈默曾替罗彪跑账，选择交代自己经手的事，转做资料整理并持续学习；叶宁是外部律师，带教、核验，不用一句“改过”抹去他的旧事。陈默到数年后的收官才取得律师身份。","许总、朴总、罗彪、黑隼： 天穹掌权者、执行高层、线下打手头目和灰产中间人。靠代理人控制他人，也在亏损、欠款和责任面前互相切割；每次失手都留下真实成本。","许明： 因母亲医药费受制于天穹的卧底。林辰第一天便知情，仍给他真实元老待遇，等他能安顿母亲后收网，第10集已撤职停权。他在终局补交自己经手的材料，不能因此回到原职或成为反攻的唯一救命筹码。","姜雯、唐曼、顾承泽： 分别以旧婚姻、旧爱情和家世渠道向老周、阿凯、烈刃索取决定权；当事人各自作出选择，林辰为他们保住能够选择的位置。","秦岚、青年： 秦岚以少数股权合作提供约定资源，不干预感情线；青年从反复修改手绘地图走向正式创作与分账，是主角团队把上升机会交给更多人的延伸。","呈现与衔接： 承接用户锁定的优化版前十集，第11集从自主公会登记开放展开。第11—65集在原事件内增加攻防回合、人物选择和获胜后的回报；商业阶段、主要胜负、原有经营金额及人物关系的关键节点不变。前十集原Word与样片不作内容修改。沙那德中的人物就是本人，游戏攻防在战场内完成，现实承担必要的规则、反应和兑现；不拍键鼠代替打斗，不新增穿越技术。","播放与时长： 按全季以约1.3倍速播放后约90分钟设计，正常速度预算为117分钟。前十集沿用20分22.5秒，后55集为96分37.5秒，较上一版后段增加27分钟。第11集正常速度2分15秒；第17、18、19、58集各1分30秒；第20、34、61、62集各2分钟；第65集1分37.5秒；其余各1分45秒。预算包含开场、转场和片尾钩子，尚未排演实测，不能将动作描写字数等同实际镜头时长。训练、赛季、生产与结算以原有时间跳转推进。"],"sceneCount":64,"lineCount":634}],"versionBasis":"根据新版前10集及既有50集大纲扩展。最新要求为“65集、90分钟、前10集保留”。本版仅调整第11—65集；第01—10集的大纲标题、正文、顺序和原时长标注完整保留，源剧本与样片不改。","roundAddition":"第11—65集保留原有商业事件顺序、主要胜负、游戏成果和公司成长结果，在现有事件中加入天穹私下雇用有黑帮背景者实施恐吓、打砸、逼签、抢证与围堵的冲突，以及烈刃、老周、阿凯的感情冲突。新增人物与私人关系属于本轮创作，不倒写进前10集。单集标题、集数和时长预算不变，以动作、关系交锋替换原场中的重复讲解。","genre":"重生、游戏创业、现实商战、黑道围剿、情感背叛、复仇、高手群像爽剧；竖屏漫剧。","coreHighlight":"林辰不仅自己最强，还把被埋没的高手带成有钱、有股份、有决定权的事业伙伴。敌人以为能用资本买走玩家、明星、渠道和作品，林辰当场让对方看见：真正有价值的人、产品和生意，已经被他提前组织起来。","mainline":"自主公会 → 职业电竞 → 游戏IP与实体商业 → 玩家创作和多游戏发行 → 海外经营 → 天穹清算、游戏集团崛起。游戏研发、运营、发行始终是最大业务，其他收入反哺游戏。","duration":"全季成片预算 5,400秒（合计90分钟，共6阶段·65集）","wholeSeasonParas":["林辰重生回2002年，以《决战破晓》重新创业。他亲自击败并招揽不得志的游戏高手，把工资、预算和权责真正交到他们手里；面对天穹的收购、挖角与卧底，早已知道许明身份的他控制资料出口，借对手围剿完成第一次公开反攻。前10集按现有版本保留。","第11集起，他鼓励玩家自己建公会。天穹收买会长、制造收费谣言、霸占场地，想把玩家重新变成可出售的名单。林辰把公会权益、驻地建设和合作网吧提前落地，亲自用实战和真实产品打穿指控，让普通公会有旗帜、有空间、有自己的胜利。对方花钱控制的人没有跟着走，反而为林辰带来更多门店与付费需求。","林辰再把公会中的高手带进职业体系：阿野从送货员成为有工资的选手，名气不再可以买晋级，明星离开也带不走整套赛事。他拿下设备、赞助与节目订单，分别击破竞品、假赛收买和外挂破坏。玩家凭实力拿奖金，创始伙伴凭经营成果拿股权；林辰掌握赛事与产品，不亲自下场争夺主办方正式奖项。","冠军、四职业、公会文化开始带来周边、主题门店、动画和新赛季收入。天穹抢权利、抢署名、封销售入口，又发动诉讼消耗、断服和刷金。林辰在每个对峙中拿出此前已经落实的合同、产能、服务与经营储备，让可靠伙伴接到订单，让元老成为事业负责人。每次守住的都是正在运营的游戏，每次拿到的都是能结算的生意。","由公会创作走向平台与多游戏发行，林辰让更多不得志的创作者获得署名与分账；海外试点从高手展示走到真实用户和核账回款。天穹的失败成本、亏损和债务持续累积，其执行者为欠款和切割交出自己经手的材料。林辰带着此前核实的证据赴峰会，回应指控、揭开围剿，随后亲自完成新品展示和国际签约。旧资本在后续经营与责任追究中崩塌，新公司完成海外履约、接手优质研发资产，最终成长为林辰与伙伴掌握的游戏商业集团。","天穹的线下暴力不是另一套故事：朴总通过罗彪把渠道封锁变成砸店、把职业合同变成逼签、把赛事翻车变成抢证。林辰提前建立门店接应、现场安保、数据留存和多地运营，既亲自挡住当面袭击，也让已经落实的比赛、发售和签约照常兑现。黑隼与罗彪因失败追款，最终把暗中的委托关系带回天穹面前。","感情压力跟随事业升级：烈刃从主动试探走向公开偏爱，顾承泽则把赞助和渠道当作求爱的筹码；老周前妻见他翻身后想拿回控制权，阿凯前女友替旧上司争夺署名。林辰在每次商业对峙里给伙伴撑住位置，伙伴自己做出拒绝旧关系的选择，跨越阶层也意味着不再接受过去的羞辱。"],"executionRules":["林辰每集都有改变结果的行动。 亲自出战、主持对峙、拿下订单或兑现权益；关键胜局由他的准备与实力完成。烈刃带来人脉和合作入口，团队负责各自专业工作，均不替代他赢。","林辰始终掌握关键筹码。 开战前落下准备，交锋时控制反击节奏，最后当面对手拿到成果。外界误判集中在第09—10、19—20、33—34、44、59—62集，其余集数让他直接进攻，不每次都演濒临破产。","全员高手，林辰最强。 游戏交锋服务于现实利益：赢回名誉、证明商品价值、拿到合作或击碎资本对高手的定价。游戏里的主角不靠后台改数值取胜。","许明身份不改。 林辰从入伙起就知道他是卧底，前期工资、分账与元老待遇真实，核心算法隔离。第10集收网，之后不复职；第60集补交材料不能变成救命关键。","公会真正自主。 林辰鼓励自建和自愿合作；会长不能把成员、个人装备和未授权作品整体卖掉。职业签约与商业授权另谈，普通公会可以一直只玩游戏。","收费接新版。 免费游玩、点卡充值装备不改。第11集起补充世界服同档装备有玩法取得路径、属性上限公开、正式赛事统一配置；不把既有装备收费改写成从未卖装备。","每次商业化争的是不同利益。 会长争成员控制，明星争特权，节目商争内容权，工厂争偷工利润，渠道争定价，发行商争未来版权，海外代理争结算。避免连续用“造谣—放证据”重复同一场。","阶层跃升有具体落点。 工资到账、姓名印在作品上、股份入手、签预算、带专业团队、决定投哪款游戏。敌人失去的订单与控制权，变成林辰和可靠伙伴实实在在的收益。","年代与时间有推进。 自2002年起，用论坛、网吧、杂志、影碟和游戏栏目传播，之后按赛季与年度发展。既有世界冠军履历保留，林辰打造的是自有游戏的职业产业体系。","证据、服务与资金均有来源。 提前留档、真实交易、执行者本人经手的材料和约定核账支撑反攻；不靠随口宣布拿到所有银行账户，也不靠一场比赛证明所有技术问题。峰会打掉融资信任，破产与责任处理在后续时间中兑现。","现实暴力由商业围剿引发。 罗彪收钱办脏事，每次动手都要夺走明确东西：门店营业、选手签字、设备证据、货物验收、服务恢复或赴会机会。林辰提前保护核心资产和人员，现场也亲自挡人、护伙伴、调度接应；小苏承担高强度近身动作。拒绝合作后的敌人可以真实打砸，损害有记录和后续，但不能靠突然绑走核心人物逼林辰临时屈服。","感情在利益压力下见真心。 烈刃的主动靠近与顾承泽的购买欲对照；老周拒绝拿股权和成果换复合；阿凯拒绝拿署名换旧爱。林辰理解并回应烈刃的偏爱，不被桃色谣言和吃醋牵着走。秦岚保持专业投资人身份，感情终局仍不强定婚姻。","新增动作占原场时长。 75秒集内，现实打斗通常8—12秒，90秒关键集或第60集可留约15秒；通过入场前准备、一次冲突和即时兑现完成。已有游戏大战的集数以原游戏胜局为核心，现实与感情多用一个动作收尾，不并列塞入两场完整大战。","前10集姓名与关系沿用。 正文统一用林辰；许总、朴总是天穹高层，许明是卧底元老。烈刃身份按新版采用，独立公会与好感线持续，不擅自确定本名、公会名或婚恋终局。"],"durationTable":[["第01集，现有样片","2分22.5秒","2分22.5秒"],["第02集","2分10秒","2分10秒"],["第03集","1分50秒","1分50秒"],["第04—10集，共7集","每集2分钟","14分钟"],["第11—64集中，除第20、34、61、62集以外的50集","每集1分15秒","62分30秒"],["第20、34、61、62集，共4集","每集1分30秒","6分钟"],["第65集","1分07.5秒","1分07.5秒"],["合计65集","前10集20分22.5秒；后55集69分37.5秒","90分钟"]],"stageGrowthTable":[["第01—10集：收服高手，打出自己的公司","招贤、开服、知情用谍、反攻签约","充值与渠道收入；初创班底站稳","20分22.5秒"],["第11—22集：公会自主，谁也卖不走我的玩家","会长卖人、驻地垄断、舆论逼宫、场地封锁","公会生态、装饰订单、门店扩张与邀请赛","15分15秒"],["第23—36集：职业电竞，高手开始靠本事跨越阶层","苛刻合同、明星特权、竞品抢人、买通与作弊","职业岗位、赛事赞助、节目发行与元老股权","17分45秒"],["第37—50集：游戏IP变现，钱和作品都由我们做主","买断版权、劣质代工、抢署名、封柜台、断服与刷金","授权、实体周边、主题门店、新赛季与动画发行","17分30秒"],["第51—58集：创作与海外，把一款游戏做成产业","刷榜、压价发行、海外少报账款、高手压价","玩家创作分账、多游戏发行、海外试点实收","10分钟"],["第59—65集：正面清算，游戏商业帝国落地","全球权利争夺、威胁、峰会指控、合同兑付","国际发行、实际运营回款、研发资产与集团成长","9分7.5秒"]],"charBioTable":[["林辰","重生制作人，早知许明身份；厚待元老、主动布局产品与商业，支持玩家自主公会","主用剑武士，精通四职业，操作、预判、战术与指挥最强","游戏创始人→职业赛事与IP经营者→平台和国际集团掌舵者"],["老周","妻离子散的中年技术高手，曾替旧公司背事故责任，靠修电脑谋生；对签字担责有阴影，林辰先替他承担经营决定","枪械师，远程封路、打断与残局判断","技术骨干→赛事技术团队负责人→平台与研发负责人，拥有股份和决策权"],["阿凯","作品署名被抢，外冷内热、寡言，擅长视觉、角色和空间设计","魔法师，控场、地形与技能配合","恢复署名→赛事视觉与IP负责人→内容事业负责人，获得长期收益"],["小苏","曾在投诉岗位替别人收拾残局；父亲是泰拳拳王，自幼习武，负责玩家与赛事运营","格斗师，近身突破与识破习惯","公会与玩家运营→职业联赛负责人→玩家、赛事与创作者业务负责人"],["许明","初创元老兼天穹卧底；前期实际获薪、分成与发行职务，第10集林辰明确揭示给予接触机会和信任表象是诱饵；核心技术始终隔离","枪械师高手，擅长游击与诱敌，弱于林辰","第10集反攻后退出；第60集补交材料，不自动免除责任或恢复职位"],["许总","天穹掌权者，擅长通过资金和代理人控制行业","现实操盘者","先买会长，再争赛事与游戏商业入口，最终经营和权力崩塌"],["朴总","执行渗透、收买、灰产与威胁","借会长、明星、经纪人和灰产执行","付出成本却无法控制玩家，最终与许总切割，谋害等行为进入处理"],["玄狼","新增阶段对手，龙庭会长，把成员规模作为向天穹开价的筹码","有水平但依赖人数与组织优势，明显低于林辰","把兄弟卖成名单，最终因成员自由选择失 与付费需求。","location":"《决战破晓》第一季整季故事","characters":["林辰","老周","阿凯","小苏","烈刃"]},{"chapter":11,"title":"【整季故事脉络 · 第3段】林辰再把公会中的高手带进职业体系：阿野从送货…","summary":"林辰再把公会中的高手带进职业体系：阿野从送货员成为有工资的选手，名气不再可以买晋级，明星离开也带不走整套赛事。他拿下设备、赞助与节目订单，分别击破竞品、假赛收买和外挂破坏。玩家凭实力拿奖金，创始伙伴凭经营成果拿股权；林辰掌握赛事与产品，不亲自下场争夺主办方正式奖项。","location":"《决战破晓》第一季整季故事","characters":["林辰","老周","阿凯","小苏","烈刃"]},{"chapter":12,"title":"【整季故事脉络 · 第4段】冠军、四职业、公会文化开始带来周边、主题门店…","summary":"冠军、四职业、公会文化开始带来周边、主题门店、动画和新赛季收入。天穹抢权利、抢署名、封销售入口，又发动诉讼消耗、断服和刷金。林辰在每个对峙中拿出此前已经落实的合同、产能、服务与经营储备，让可靠伙伴接到订单，让元老成为事业负责人。每次守住的都是正在运营的游戏，每次拿到的都是能结算的生意。","location":"《决战破晓》第一季整季故事","characters":["林辰","老周","阿凯","小苏","烈刃"]},{"chapter":13,"title":"【整季故事脉络 · 第5段】由公会创作走向平台与多游戏发行，林辰让更多不…","summary":"由公会创作走向平台与多游戏发行，林辰让更多不得志的创作者获得署名与分账；海外试点从高手展示走到真实用户和核账回款。天穹的失败成本、亏损和债务持续累积，其执行者为欠款和切割交出自己经手的材料。林辰带着此前核实的证据赴峰会，回应指控、揭开围剿，随后亲自完成新品展示和国际签约。旧资本在后续经营与责任追究中崩塌，新公司完成海外履约、接手优质研发资产，最终成长为林辰与伙伴掌握的游戏商业集团。","location":"《决战破晓》第一季整季故事","characters":["林辰","老周","阿凯","小苏","烈刃"]},{"chapter":14,"title":"【整季故事脉络 · 第6段】天穹的线下暴力不是另一套故事：朴总通过罗彪把…","summary":"天穹的线下暴力不是另一套故事：朴总通过罗彪把渠道封锁变成砸店、把职业合同变成逼签、把赛事翻车变成抢证。林辰提前建立门店接应、现场安保、数据留存和多地运营，既亲自挡住当面袭击，也让已经落实的比赛、发售和签约照常兑现。黑隼与罗彪因失败追款，最终把暗中的委托关系带回天穹面前。","location":"《决战破晓》第一季整季故事","characters":["林辰","老周","阿凯","小苏","烈刃"]},{"chapter":15,"title":"【整季故事脉络 · 第7段】感情压力跟随事业升级：烈刃从主动试探走向公开…","summary":"感情压力跟随事业升级：烈刃从主动试探走向公开偏爱，顾承泽则把赞助和渠道当作求爱的筹码；老周前妻见他翻身后想拿回控制权，阿凯前女友替旧上司争夺署名。林辰在每次商业对峙里给伙伴撑住位置，伙伴自己做出拒绝旧关系的选择，跨越阶层也意味着不再接受过去的羞辱。","location":"《决战破晓》第一季整季故事","characters":["林辰","老周","阿凯","小苏","烈刃"]}]},{"id":"orig_sec2","range":"总纲模块 02 · 六阶段商业成长表","name":"六阶段核心冲突与商业阶层成果总表","desc":"从第01—10集初创班底、第11—22集公会自主、第23—36集职业电竞、第37—50集IP变现、第51—58集创作出海到第59—65集帝国落地。","chapters":[{"chapter":1,"title":"第01—10集：收服高手，打出自己的公司（时长：20分22.5秒）","summary":"【不同的核心冲突】招贤、开服、知情用谍、反攻签约 ｜ 【可见的商业与阶层成果】充值与渠道收入；初创班底站稳 ｜ 【阶段时长】20分22.5秒。","location":"第01—10集：收服高手，打出自己的公司","characters":["林辰","老周","阿凯","小苏"]},{"chapter":2,"title":"第11—22集：公会自主，谁也卖不走我的玩家（时长：15分15秒）","summary":"【不同的核心冲突】会长卖人、驻地垄断、舆论逼宫、场地封锁 ｜ 【可见的商业与阶层成果】公会生态、装饰订单、门店扩张与邀请赛 ｜ 【阶段时长】15分15秒。","location":"第11—22集：公会自主，谁也卖不走我的玩家","characters":["林辰","老周","阿凯","小苏"]},{"chapter":3,"title":"第23—36集：职业电竞，高手开始靠本事跨越阶层（时长：17分45秒）","summary":"【不同的核心冲突】苛刻合同、明星特权、竞品抢人、买通与作弊 ｜ 【可见的商业与阶层成果】职业岗位、赛事赞助、节目发行与元老股权 ｜ 【阶段时长】17分45秒。","location":"第23—36集：职业电竞，高手开始靠本事跨越阶层","characters":["林辰","老周","阿凯","小苏"]},{"chapter":4,"title":"第37—50集：游戏IP变现，钱和作品都由我们做主（时长：17分30秒）","summary":"【不同的核心冲突】买断版权、劣质代工、抢署名、封柜台、断服与刷金 ｜ 【可见的商业与阶层成果】授权、实体周边、主题门店、新赛季与动画发行 ｜ 【阶段时长】17分30秒。","location":"第37—50集：游戏IP变现，钱和作品都由我们做主","characters":["林辰","老周","阿凯","小苏"]},{"chapter":5,"title":"第51—58集：创作与海外，把一款游戏做成产业（时长：10分钟）","summary":"【不同的核心冲突】刷榜、压价发行、海外少报账款、高手压价 ｜ 【可见的商业与阶层成果】玩家创作分账、多游戏发行、海外试点实收 ｜ 【阶段时长】10分钟。","location":"第51—58集：创作与海外，把一款游戏做成产业","characters":["林辰","老周","阿凯","小苏"]},{"chapter":6,"title":"第59—65集：正面清算，游戏商业帝国落地（时长：9分7.5秒）","summary":"【不同的核心冲突】全球权利争夺、威胁、峰会指控、合同兑付 ｜ 【可见的商业与阶层成果】国际发行、实际运营回款、研发资产与集团成长 ｜ 【阶段时长】9分7.5秒。","location":"第59—65集：正面清算，游戏商业帝国落地","characters":["林辰","老周","阿凯","小苏"]}]},{"id":"orig_sec3","range":"总纲模块 03 · 17位人物小传总表","name":"全剧 17 位核心与新增人物小传（现实关系 × 游戏定位 × 成长结果）","desc":"完整收录大纲人物小传表：林辰、老周、阿凯、小苏、许明、许总、朴总、玄狼、铁头、阿野、烈刃、叶宁、秦岚、罗彪、顾承泽、姜雯、唐曼。","chapters":[{"chapter":1,"title":"【人物档案】林辰 —— 主用剑武士，精通四职业，操作、预判、战术与指挥最强","summary":"【现实能力与关系】重生制作人，早知许明身份；厚待元老、主动布局产品与商业，支持玩家自主公会 ｜ 【游戏定位】主用剑武士，精通四职业，操作、预判、战术与指挥最强 ｜ 【成长与结果】游戏创始人→职业赛事与IP经营者→平台和国际集团掌舵者。","location":"主用剑武士，精通四职业，操作、预判、战术与指挥最强","characters":["林辰"]},{"chapter":2,"title":"【人物档案】老周 —— 枪械师，远程封路、打断与残局判断","summary":"【现实能力与关系】妻离子散的中年技术高手，曾替旧公司背事故责任，靠修电脑谋生；对签字担责有阴影，林辰先替他承担经营决定 ｜ 【游戏定位】枪械师，远程封路、打断与残局判断 ｜ 【成长与结果】技术骨干→赛事技术团队负责人→平台与研发负责人，拥有股份和决策权。","location":"枪械师，远程封路、打断与残局判断","characters":["老周"]},{"chapter":3,"title":"【人物档案】阿凯 —— 魔法师，控场、地形与技能配合","summary":"【现实能力与关系】作品署名被抢，外冷内热、寡言，擅长视觉、角色和空间设计 ｜ 【游戏定位】魔法师，控场、地形与技能配合 ｜ 【成长与结果】恢复署名→赛事视觉与IP负责人→内容事业负责人，获得长期收益。","location":"魔法师，控场、地形与技能配合","characters":["阿凯"]},{"chapter":4,"title":"【人物档案】小苏 —— 格斗师，近身突破与识破习惯","summary":"【现实能力与关系】曾在投诉岗位替别人收拾残局；父亲是泰拳拳王，自幼习武，负责玩家与赛事运营 ｜ 【游戏定位】格斗师，近身突破与识破习惯 ｜ 【成长与结果】公会与玩家运营→职业联赛负责人→玩家、赛事与创作者业务负责人。","location":"格斗师，近身突破与识破习惯","characters":["小苏"]},{"chapter":5,"title":"【人物档案】许明 —— 枪械师高手，擅长游击与诱敌，弱于林辰","summary":"【现实能力与关系】初创元老兼天穹卧底；前期实际获薪、分成与发行职务，第10集林辰明确揭示给予接触机会和信任表象是诱饵；核心技术始终隔离 ｜ 【游戏定位】枪械师高手，擅长游击与诱敌，弱于林辰 ｜ 【成长与结果】第10集反攻后退出；第60集补交材料，不自动免除责任或恢复职位。","location":"枪械师高手，擅长游击与诱敌，弱于林辰","characters":["许明"]},{"chapter":6,"title":"【人物档案】许总 —— 现实操盘者","summary":"【现实能力与关系】天穹掌权者，擅长通过资金和代理人控制行业 ｜ 【游戏定位】现实操盘者 ｜ 【成长与结果】先买会长，再争赛事与游戏商业入口，最终经营和权力崩塌。","location":"现实操盘者","characters":["许总"]},{"chapter":7,"title":"【人物档案】朴总 —— 借会长、明星、经纪人和灰产执行","summary":"【现实能力与关系】执行渗透、收买、灰产与威胁 ｜ 【游戏定位】借会长、明星、经纪人和灰产执行 ｜ 【成长与结果】付出成本却无法控制玩家，最终与许总切割，谋害等行为进入处理。","location":"借会长、明星、经纪人和灰产执行","characters":["朴总"]},{"chapter":8,"title":"【人物档案】玄狼 —— 有水平但依赖人数与组织优势，明显低于林辰","summary":"【现实能力与关系】新增阶段对手，龙庭会长，把成员规模作为向天穹开价的筹码 ｜ 【游戏定位】有水平但依赖人数与组织优势，明显低于林辰 ｜ 【成长与结果】把兄弟卖成名单，最终因成员自由选择失去控制和信用。","location":"有水平但依赖人数与组织优势，明显低于林辰","characters":["玄狼"]},{"chapter":9,"title":"【人物档案】铁头 —— 有实战能力，擅长长期磨合，低于核心高手","summary":"【现实能力与关系】连锁网吧巨头、玩家队长；首批合作从三家门店起步，之后扩大其网络，自愿发起燎原公会并支持职业队 ｜ 【游戏定位】有实战能力，擅长长期磨合，低于核心高手 ｜ 【成长与结果】渠道伙伴→公会组织者→职业队与主题活动合作方。","location":"有实战能力，擅长长期磨合，低于核心高手","characters":["铁头"]},{"chapter":10,"title":"【人物档案】阿野 —— 有天赋的公会高手，通过训练成长，弱于林辰","summary":"【现实能力与关系】二十二岁送货员，因上线时间不固定被大公会排斥，自愿加入燎原，凭本事进入职业体系 ｜ 【游戏定位】有天赋的公会高手，通过训练成长，弱于林辰 ｜ 【成长与结果】普通玩家→拿工资的选手→靠成绩获得认可与商业身价。","location":"有天赋的公会高手，通过训练成长，弱于林辰","characters":["阿野"]},{"chapter":11,"title":"【人物档案】烈刃 —— 格斗师，超一流水平，明显弱于林辰；本名与公会名暂不另定","summary":"【现实能力与关系】女性，欧阳世家的小女儿、前世界冠军队伍成员及前十游戏公会会长；火爆骄傲，只服更强者，第06集败于林辰后出现好感与合作意愿 ｜ 【游戏定位】格斗师，超一流水平，明显弱于林辰；本名与公会名暂不另定 ｜ 【成长与结果】挑战者→公会合作与早期强援→独立职业队与品牌伙伴；提供入口和支持，关键胜局仍由林辰拿下。","location":"格斗师，超一流水平，明显弱于林辰；本名与公会名暂不另定","characters":["烈刃"]},{"chapter":12,"title":"【人物档案】叶宁 —— 外部专业伙伴","summary":"【现实能力与关系】外部律师，核对合同、版权与有来源的证据；分清公开说明与提交调查的材料 ｜ 【游戏定位】外部专业伙伴 ｜ 【成长与结果】将许明、赛事、灰产和委托结算的实际来源交叉核实，不靠偷取对手账户或临时编出证据。","location":"外部专业伙伴","characters":["叶宁"]},{"chapter":13,"title":"【人物档案】秦岚 —— 外部资金伙伴","summary":"【现实能力与关系】外部投资人，依据真实业绩于第50集谈少数股权合作 ｜ 【游戏定位】外部资金伙伴 ｜ 【成长与结果】为创作工具、合作游戏和海外试点补充资源，林辰保留控制权。","location":"外部资金伙伴","characters":["秦岚"]},{"chapter":14,"title":"【人物档案】罗彪 —— 线下反派，不加入主角游戏班底","summary":"【现实能力与关系】新增：有黑帮背景的打手头目，替人暴力讨债、强占场地；受朴总及黑隼等人付费雇用，不是林辰的暗中手下 ｜ 【游戏定位】线下反派，不加入主角游戏班底 ｜ 【成长与结果】恐吓门店、逼签、抢证、堵厂与机房破坏；失败后向雇主讨债，最终承担查明责任。","location":"线下反派，不加入主角游戏班底","characters":["罗彪"]},{"chapter":15,"title":"【人物档案】顾承泽 —— 外部商业情敌","summary":"【现实能力与关系】新增：与天穹有渠道往来的富家经营者，熟识欧阳家、长期追求烈刃；没有获得她认可的婚约 ｜ 【游戏定位】外部商业情敌 ｜ 【成长与结果】用收购、赞助与国际渠道逼两人让步；每次都被真实产品和订单挡回去，第59集失去议价与感情幻想。","location":"外部商业情敌","characters":["顾承泽"]},{"chapter":16,"title":"【人物档案】姜雯 —— 私人关系角色","summary":"【现实能力与关系】新增姓名及后续关系：老周前妻，认可稳定和现成财富，旧雇主借她劝返老周 ｜ 【游戏定位】私人关系角色 ｜ 【成长与结果】先轻视游戏事业，见到账与股权后提出复合、代管；老周拒绝用成果和控制权换旧关系。","location":"私人关系角色","characters":["姜雯"]},{"chapter":17,"title":"【人物档案】唐曼 —— 私人关系角色","summary":"【现实能力与关系】新增：阿凯前女友、旧项目共事者，曾在署名争执中站到前上司一边，本轮继续替其作伪证式指控 ｜ 【游戏定位】私人关系角色 ｜ 【成长与结果】第37集联络，第40集借旧情夺署名失败，第48集求复合被拒；阿凯保住名字与新事业。","location":"私人关系角色","characters":["唐曼"]}]},{"id":"orig_sec4","range":"总纲模块 04 · 人物与爽感14条铁律","name":"《决战破晓》人物与爽感执行 14 条核心准则","desc":"涵盖林辰每集行动、筹码掌控、全员高手、许明卧底边界、公会自主、收费衔接、阶层跃升落点、证据来源、罗彪暴力边界与感情线准则。","chapters":[{"chapter":1,"title":"【执行铁律 01】林辰每集都有改变结果的行动","summary":"林辰每集都有改变结果的行动。 亲自出战、主持对峙、拿下订单或兑现权益；关键胜局由他的准备与实力完成。烈刃带来人脉和合作入口，团队负责各自专业工作，均不替代他赢。","location":"人物与爽感执行规范","characters":["林辰","编导组"]},{"chapter":2,"title":"【执行铁律 02】林辰始终掌握关键筹码","summary":"林辰始终掌握关键筹码。 开战前落下准备，交锋时控制反击节奏，最后当面对手拿到成果。外界误判集中在第09—10、19—20、33—34、44、59—62集，其余集数让他直接进攻，不每次都演濒临破产。","location":"人物与爽感执行规范","characters":["林辰","编导组"]},{"chapter":3,"title":"【执行铁律 03】全员高手，林辰最强","summary":"全员高手，林辰最强。 游戏交锋服务于现实利益：赢回名誉、证明商品价值、拿到合作或击碎资本对高手的定价。游戏里的主角不靠后台改数值取胜。","location":"人物与爽感执行规范","characters":["林辰","编导组"]},{"chapter":4,"title":"【执行铁律 04】许明身份不改","summary":"许明身份不改。 林辰从入伙起就知道他是卧底，前期工资、分账与元老待遇真实，核心算法隔离。第10集收网，之后不复职；第60集补交材料不能变成救命关键。","location":"人物与爽感执行规范","characters":["林辰","编导组"]},{"chapter":5,"title":"【执行铁律 05】公会真正自主","summary":"公会真正自主。 林辰鼓励自建和自愿合作；会长不能把成员、个人装备和未授权作品整体卖掉。职业签约与商业授权另谈，普通公会可以一直只玩游戏。","location":"人物与爽感执行规范","characters":["林辰","编导组"]},{"chapter":6,"title":"【执行铁律 06】收费接新版","summary":"收费接新版。 免费游玩、点卡充值装备不改。第11集起补充世界服同档装备有玩法取得路径、属性上限公开、正式赛事统一配置；不把既有装备收费改写成从未卖装备。","location":"人物与爽感执行规范","characters":["林辰","编导组"]},{"chapter":7,"title":"【执行铁律 07】每次商业化争的是不同利益","summary":"每次商业化争的是不同利益。 会长争成员控制，明星争特权，节目商争内容权，工厂争偷工利润，渠道争定价，发行商争未来版权，海外代理争结算。避免连续用“造谣—放证据”重复同一场。","location":"人物与爽感执行规范","characters":["林辰","编导组"]},{"chapter":8,"title":"【执行铁律 08】阶层跃升有具体落点","summary":"阶层跃升有具体落点。 工资到账、姓名印在作品上、股份入手、签预算、带专业团队、决定投哪款游戏。敌人失去的订单与控制权，变成林辰和可靠伙伴实实在在的收益。","location":"人物与爽感执行规范","characters":["林辰","编导组"]},{"chapter":9,"title":"【执行铁律 09】年代与时间有推进","summary":"年代与时间有推进。 自2002年起，用论坛、网吧、杂志、影碟和游戏栏目传播，之后按赛季与年度发展。既有世界冠军履历保留，林辰打造的是自有游戏的职业产业体系。","location":"人物与爽感执行规范","characters":["林辰","编导组"]},{"chapter":10,"title":"【执行铁律 10】证据、服务与资金均有来源","summary":"证据、服务与资金均有来源。 提前留档、真实交易、执行者本人经手的材料和约定核账支撑反攻；不靠随口宣布拿到所有银行账户，也不靠一场比赛证明所有技术问题。峰会打掉融资信任，破产与责任处理在后续时间中兑现。","location":"人物与爽感执行规范","characters":["林辰","编导组"]},{"chapter":11,"title":"【执行铁律 11】现实暴力由商业围剿引发","summary":"现实暴力由商业围剿引发。 罗彪收钱办脏事，每次动手都要夺走明确东西：门店营业、选手签字、设备证据、货物验收、服务恢复或赴会机会。林辰提前保护核心资产和人员，现场也亲自挡人、护伙伴、调度接应；小苏承担高强度近身动作。拒绝合作后的敌人可以真实打砸，损害有记录和后续，但不能靠突然绑走核心人物逼林辰临时屈服。","location":"人物与爽感执行规范","characters":["林辰","编导组"]},{"chapter":12,"title":"【执行铁律 12】感情在利益压力下见真心","summary":"感情在利益压力下见真心。 烈刃的主动靠近与顾承泽的购买欲对照；老周拒绝拿股权和成果换复合；阿凯拒绝拿署名换旧爱。林辰理解并回应烈刃的偏爱，不被桃色谣言和吃醋牵着走。秦岚保持专业投资人身份，感情终局仍不强定婚姻。","location":"人物与爽感执行规范","characters":["林辰","编导组"]},{"chapter":13,"title":"【执行铁律 13】新增动作占原场时长","summary":"新增动作占原场时长。 75秒集内，现实打斗通常8—12秒，90秒关键集或第60集可留约15秒；通过入场前准备、一次冲突和即时兑现完成。已有游戏大战的集数以原游戏胜局为核心，现实与感情多用一个动作收尾，不并列塞入两场完整大战。","location":"人物与爽感执行规范","characters":["林辰","编导组"]},{"chapter":14,"title":"【执行铁律 14】前10集姓名与关系沿用","summary":"前10集姓名与关系沿用。 正文统一用林辰；许总、朴总是天穹高层，许明是卧底元老。烈刃身份按新版采用，独立公会与好感线持续，不擅自确定本名、公会名或婚恋终局。","location":"人物与爽感执行规范","characters":["林辰","编导组"]}]},{"id":"orig_sec5","range":"总纲模块 05 · 五大暗线起落总表","name":"新增五大暗线的起落（黑道暴力 × 雇主反噬 × 三大情感冲突）","desc":"涵盖：天穹—罗彪—线下暴力、黑帮与雇主反噬、林辰—烈刃—顾承泽、老周—姜雯、阿凯—唐曼五条贯穿暗线的前置推进与兑现。","chapters":[{"chapter":1,"title":"【暗线 01】天穹—罗彪—线下暴力","summary":"【前置与推进】第12集雇用，第13集林辰落实接应；第21集砸店、第24集逼签、第32集恐吓选手 ｜ 【原事件中的兑现】第34集抢证失败、第39集堵厂不影响发售、第44集破坏机房不影响开服、第46集暴力勒索失效。","location":"天穹—罗彪—线下暴力","characters":["天穹—罗彪—线下暴力"]},{"chapter":2,"title":"【暗线 02】黑帮与雇主反噬","summary":"【前置与推进】第45—46集异常收益被限制，刷金和恐吓都没收到钱 ｜ 【原事件中的兑现】第58集欠款内讧、实际经手者交材料；第60集朴总另找打手堵截失败，第61集委托关系公开对应，第64集处理责任。","location":"黑帮与雇主反噬","characters":["黑帮与雇主反噬"]},{"chapter":3,"title":"【暗线 03】林辰—烈刃—顾承泽","summary":"【前置与推进】第11集主动试探，第18集桃色谣言，第19集情敌拿收购谈人 ｜ 【原事件中的兑现】第27、30、31集实战与交易中正面护她，第35集公平赛果，第50集小醋意，第55、57集海外撑场；第59集情敌失去筹码，第62集公开亲近，第65集约会留白。","location":"林辰—烈刃—顾承泽","characters":["林辰—烈刃—顾承泽"]},{"chapter":4,"title":"【暗线 04】老周—姜雯","summary":"【前置与推进】第22集前妻奚落与收益到账，第36集以复合要求代管 ｜ 【原事件中的兑现】第43集拒带成果离开，第50集关掉复合短信、签研发预算；原股权与事业结果不变。","location":"老周—姜雯","characters":["老周—姜雯"]},{"chapter":5,"title":"【暗线 05】阿凯—唐曼","summary":"【前置与推进】第37集旧人主动联络，第40集替旧上司指控并以复合换署名 ｜ 【原事件中的兑现】第40集用原开发留档拆穿指控，第48集不接受回头，署名、订单与创作地位全部保留。","location":"阿凯—唐曼","characters":["阿凯—唐曼"]}]},{"id":"orig_sec6","range":"总纲模块 06 · 12组关键铺垫与回收","name":"全季 12 组关键铺垫与前后呼应回收表 & 第一季终态","desc":"确保每一次商业反击都有前置落子：备用服务、开发留档、隔离演练、多厂试样、海外核账约定、多方委托证据闭环。","chapters":[{"chapter":1,"title":"【铺垫与回收 01】第02—10集招贤、真实待遇、受控资料与备用服务","summary":"【前置准备】第02—10集招贤、真实待遇、受控资料与备用服务 ➔ 【后续兑现】前10集完整保留；第36集老周主动签字、元老获股权，第58—61集卧底材料与其他来源交叉核实。","location":"全季前后呼应链","characters":["林辰","老周","阿凯","小苏","叶宁"]},{"chapter":2,"title":"【铺垫与回收 02】第11集公会规则与驻地预告，第13—16集公开教学、跨会协作、门店排期","summary":"【前置准备】第11集公会规则与驻地预告，第13—16集公开教学、跨会协作、门店排期 ➔ 【后续兑现】第17集玩家获得驻地，第19—20集会长卖不走成员，第21—22集分站赛与门店订单。","location":"全季前后呼应链","characters":["林辰","老周","阿凯","小苏","叶宁"]},{"chapter":3,"title":"【铺垫与回收 03】第13集开发留档与异常记录，第18集传播材料及原始收费说明","summary":"【前置准备】第13集开发留档与异常记录，第18集传播材料及原始收费说明 ➔ 【后续兑现】第19—20集分项公开核验；团战负责展示可玩性，不替代其他证据。","location":"全季前后呼应链","characters":["林辰","老周","阿凯","小苏","叶宁"]},{"chapter":4,"title":"【铺垫与回收 04】第22—23集节目意向、候补制度、地图测试与举报规则","summary":"【前置准备】第22—23集节目意向、候补制度、地图   arcFilter: "all",         // 单元筛选：all | arc1 .. arc10
  openDropdown: null,       // null | "chapter" | "arc"
  sysFilter: "all",
  search: "",
  scriptTrackFilter: "all", // all | dual | sys
  activeSceneNum: null,
  activeCardIdx: 0,
  collapsedArcs: {},
  albumCategory: "all",     // all | hero | crimson | obsidian
  chapterVersions: { ch1: "v2.0", ch2: "v2.0", ch3: "v2.0", ch4: "v2.0" },
  origArc: null,
  origChapter: null
};

function getVersion(id) { return VERSIONS.find(v => v.id === id); }

function refreshMergedData() {
  ARCS = [];
  EPISODES = [];
  const seenArcs = new Set();
  for (const ch of CHAPTERS) {
    if (ch.status === "pending") continue;
    const verId = state.chapterVersions[ch.id];
    const ver = getVersion(verId);
    if (!ver) continue;
    const chEps = ver.episodes.filter(e => {
      const epNum = parseInt(String(e.ep), 10);
      return epNum >= ch.epRange[0] && epNum <= ch.epRange[1];
    });
    for (const a of ver.arcs) {
      const hasEpInCh = chEps.some(e => e.arc === a.id);
      if (hasEpInCh && !seenArcs.has(a.id)) {
        seenArcs.add(a.id);
        ARCS.push({ ...a, chapterId: ch.id, chapterName: a.act || a.name });
      }
    }
    EPISODES = EPISODES.concat(chEps.map(e => ({ ...e, chapterId: ch.id })));
  }
  buildSearchIndex();
  precomputeMacroCurve();
}

function buildSearchIndex() {
  for (const ep of EPISODES) {
    const sceneTxt = (ep.scenes || []).map(sc => sc.rawHeader + " " + sc.lines.join(" ")).join(" ");
    ep._idx = (
      "ep" + ep.ep + " 第" + ep.ep + "集 " +
      ep.title + " " + (ep.outlineTitle || "") + " " + (ep.scriptHeader || "") + " " + (ep.scriptNotes || []).join(" ") + " " + ep.tone + " " + ep.summary + " " +
      ep.characters.join(" ") + " " + ep.novel.join(" ") + " " + sceneTxt + " " +
      ep.outline.conflict + " " + ep.outline.beats.map(b => b.label + " " + b.text).join(" ") + " " +
      ep.shots.map(s => s.label + " " + s.desc + " " + (s.skill || "") + " " + (s.fx || "")).join(" ")
    ).toLowerCase();
  }
}

function precomputeMacroCurve() {
  const MW = 320, MH = 80, mPadX = 12, mPadY = 14;
  const total = Math.max(1, EPISODES.length - 1);
  MACRO_COORDS = EPISODES.map((e, idx) => {
    const x = mPadX + (idx / total) * (MW - mPadX * 2);
    const sc = e.macroEmotionScore || 65;
    const y = (MH - mPadY) - ((sc - 20) / 80) * (MH - mPadY * 2);
    return { epNum: idx + 1, x: +(x.toFixed(1)), y: +(y.toFixed(1)), isKey: e.isKeySys, score: sc };
  });
  MACRO_POLYLINE = MACRO_COORDS.map(c => `${c.x},${c.y}`).join(" ");
  MACRO_KEY_DOTS_HTML = MACRO_COORDS.filter(c => c.isKey).map(c => `
    <circle cx="${c.x}" cy="${c.y}" r="2.3" fill="#DC2626" style="cursor:pointer" onclick="selectEpisode(${c.epNum})">
      <title>EP${String(c.epNum).padStart(2, '0')} ★关键对峙高潮</title>
    </circle>
  `).join("");
}

function getEpObj(epNum) {
  return EPISODES.find(e => parseInt(e.ep, 10) === parseInt(epNum, 10)) || EPISODES[0];
}

function getArcObj(arcId) {
  return ARCS.find(a => a.id === arcId);
}

function matchesFilter(ep) {
  if (state.chapter !== "all" && ep.chapterId !== state.chapter) return false;
  if (state.arcFilter !== "all" && ep.arc !== state.arcFilter) return false;
  if (state.sysFilter === "script" && !ep.hasFullScript) return false;
  if (state.sysFilter === "key" && !ep.isKeySys) return false;
  if (state.sysFilter === "light" && !ep.isLightSys) return false;
  if (state.search) {
    const q = state.search.toLowerCase();
    if (!(ep._idx || "").includes(q)) return false;
  }
  return true;
}

function updateTopHud() {
  const epNum = parseInt(state.currentEp, 10) || 1;
  const meta = EP_RUNTIME_META[epNum] || EP_RUNTIME_META[1];
  document.getElementById("hudCardCount").textContent = `🏛️ ${meta.stageShort || '阶段 1/6'} (EP${String(epNum).padStart(2, '0')})`;
  document.getElementById("hudEnergyPct").textContent = `${meta.energyPct}%`;
  document.getElementById("hudEnergyBar").style.width = `${Math.max(2, parseFloat(meta.energyPct))}%`;
  document.getElementById("hudStageSkill").textContent = `💼 ${meta.activeSkill}`;
}

function renderEcgRibbon() {
  const track = document.getElementById("ecgTrack");
  if (track.childElementCount === EPISODES.length) {
    for (const ep of EPISODES) {
      const cell = track.querySelector('[data-ecg-ep="' + parseInt(ep.ep, 10) + '"]');
      cell.classList.toggle("dimmed", !matchesFilter(ep));
      cell.classList.toggle("active", parseInt(ep.ep, 10) === Number(state.currentEp));
    }
    return;
  }
  let html = "";
  for (const ep of EPISODES) {
    const epNum = parseInt(ep.ep, 10);
    const meta = EP_RUNTIME_META[epNum] || {};
    const matched = matchesFilter(ep);
    const isCur = epNum === parseInt(state.currentEp, 10);
    let cls = "ecg-cell";
    if (ep.hasFullScript) cls += " is-script";
    if (ep.isKeySys) cls += " is-key";
    else if (ep.isLightSys) cls += " is-light";
    if (!matched) cls += " dimmed";
    if (isCur) cls += " active";

    const sysLabel = ep.isKeySys ? "★关键对峙集" : (ep.isLightSys ? "⚡暗线交锋集" : (ep.hasFullScript ? "🎬详细剧本" : "大纲推进"));
    const tooltip = `EP${String(epNum).padStart(2, '0')}《${ep.title}》｜${sysLabel}｜版图 ${meta.energyPct}%`;
    html += `<div class="${cls}" data-ecg-ep="${epNum}" title="${tooltip}" onclick="selectEpisode(${epNum})"></div>`;
  }
  track.innerHTML = html;
}

function updateActiveEpisodeHighlight(epNum) {
  document.querySelectorAll("[data-ecg-ep].active, [data-tree-ep].active").forEach(el => el.classList.remove("active"));
  for (const attr of ["data-ecg-ep", "data-tree-ep"]) {
    const el = document.querySelector('[' + attr + '="' + epNum + '"]');
    if (el) el.classList.add("active");
  }
}

// ============ 左栏：美化版单行并排双下拉筛选组件（篇章筛选 + 单元筛选）与剧集树 ============
function renderDualDropdowns() {
  // 1) 渲染【篇章筛选】下拉菜单
  const chOptions = [
    { id: "all", shortLabel: "全部篇章", label: "全部篇章（全季65集）", sub: "EP01—65" },

  ];

  const chBtn = document.getElementById("chapterDdBtn");
  const chLabel = document.getElementById("chapterDdLabel");
  const chMenu = document.getElementById("chapterDdMenu");
  if (chBtn && chLabel && chMenu) {
    chBtn.classList.toggle("has-filter", state.chapter !== "all");
    chLabel.textContent = curCh.shortLabel;
    chMenu.innerHTML = chOptions.map(opt => `
      <button type="button" class="dd-option-item ${state.chapter === opt.id ? 'selected' : ''}" onclick="selectChapterDropdown('${opt.id}', event)">
        <span class="dd-opt-main">${opt.label}</span>
        <span class="dd-opt-sub">${opt.sub}</span>
      </button>
    `).join("");
  }

  // 2) 渲染【单元筛选】下拉菜单
  const arcOptions = [
    { id: "all", shortLabel: "全部阶段", label: "全部六阶段（6阶段）", sub: "EP01—65" },
    ...ARCS.map(a => ({ id: a.id, shortLabel: a.name.split("·")[0] || a.name, label: a.name, sub: a.range }))
  ];
  const curArc = arcOptions.find(o => o.id === state.arcFilter) || arcOptions[0];
  const arcBtn = document.getElementById("arcDdBtn");
  const arcLabel = document.getElementById("arcDdLabel");
  const arcMenu = document.getElementById("arcDdMenu");
  if (arcBtn && arcLabel && arcMenu) {
    arcBtn.classList.toggle("has-filter", state.arcFilter !== "all");
    arcLabel.textContent = curArc.shortLabel;
    arcMenu.innerHTML = arcOptions.map(opt => `
      <button type="button" class="dd-option-item ${state.arcFilter === opt.id ? 'selected' : ''}" onclick="selectArcDropdown('${opt.id}', event)">
        <span class="dd-opt-main">${opt.label}</span>
        <span class="dd-opt-sub">${opt.sub}</span>
      </button>
    `).join("");
  }
}

function positionDropdown() {
  const type = state.openDropdown;
  if (!type) return;
  const btn = document.getElementById(type + "DdBtn");
  const menu = document.getElementById(type + "DdMenu");
  const r = btn.getBoundingClientRect();
  const width = Math.min(270, window.innerWidth - 16);
  const left = Math.max(8, Math.min(type === "arc" ? r.right - width : r.left, window.innerWidth - width - 8));
  const below = window.innerHeight - r.bottom - 12;
  const above = r.top - 12;
  const upwards = below < 180 && above > below;
  menu.style.width = width + "px";
  menu.style.left = left + "px";
  menu.style.top = upwards ? "auto" : (r.bottom + 6) + "px";
  menu.style.bottom = upwards ? (window.innerHeight - r.top + 6) + "px" : "auto";
  menu.style.maxHeight = Math.max(60, Math.min(400, upwards ? above : below)) + "px";
}

function toggleCustomDropdown(type, ev) {
  if (ev) ev.stopPropagation();
  const next = state.openDropdown === type ? null : type;
  closeAllDropdowns();
  state.openDropdown = next;
  if (next) {
    document.getElementById(next + "DdWrap").classList.add("is-open");
    document.getElementById(next + "DdBtn").setAttribute("aria-expanded", "true");
    positionDropdown();
  }
}

function closeAllDropdowns(restoreFocus = false) {
  const previous = state.openDropdown;
  state.openDropdown = null;
  for (const type of ["chapter", "arc"]) {
    document.getElementById(type + "DdWrap").classList.remove("is-open");
    document.getElementById(type + "DdBtn").setAttribute("aria-expanded", "false");
  }
  if (restoreFocus && previous) document.getElementById(previous + "DdBtn").focus();
}
window.addEventListener("resize", positionDropdown);
window.addEventListener("scroll", positionDropdown, { passive: true });

function selectChapterDropdown(chId, ev) {
  if (ev) ev.stopPropagation();
  state.chapter = chId;
  // 若选择了具体篇章，自动重置单元筛选或保持兼容
  if (chId !== "all") {
    state.arcFilter = "all";
  }
  closeAllDropdowns(true);
  renderEcgRibbon();
  renderEpisodeTree();
  // 如果当前选中集不在筛选结果中，自动跳到筛选结果的第一集
  const visible = EPISODES.filter(matchesFilter);
  if (visible.length && !visible.some(e => parseInt(e.ep, 10) === parseInt(state.currentEp, 10))) {
    selectEpisode(parseInt(visible[0].ep, 10), false);
  }
}

function selectArcDropdown(arcId, ev) {
  if (ev) ev.stopPropagation();
  state.arcFilter = arcId;
  if (arcId !== "all") {
    state.chapter = "all";
    state.collapsedArcs[arcId] = false;
  }
  closeAllDropdowns(true);
  renderEcgRibbon();
  renderEpisodeTree();
  const visible = EPISODES.filter(matchesFilter);
  if (visible.length && !visible.some(e => parseInt(e.ep, 10) === parseInt(state.currentEp, 10))) {
    selectEpisode(parseInt(visible[0].ep, 10), false);
  }
}

function renderEpisodeTree() {
  renderDualDropdowns();
  const container = document.getElementById("episodeTreeContainer");
  const filteredEps = EPISODES.filter(matchesFilter);
  document.getElementById("treeCountLabel").textContent = `${filteredEps.length}/65集`;

  if (filteredEps.length === 0) {
    container.innerHTML = `
      <div style="padding:32px 14px;text-align:center;color:var(--ink-3);font-size:12.5px">
        <div style="margin-bottom:8px">未找到匹配剧集</div>
        <button type="button" class="ep-step-btn" onclick="resetStudioFilters()">重置全部筛选</button>
      </div>
    `;
    return;
  }

  let html = "";
  let lastAct = "";
  for (const arc of ARCS) {
    const arcEps = filteredEps.filter(e => e.arc === arc.id);
    if (arcEps.length === 0) continue;

    if (arc.act && arc.act !== lastAct) {
      html += `<div class="tree-act-banner">▸ ${arc.act}</div>`;
      lastAct = arc.act;
    }

    const isCollapsed = Boolean(state.collapsedArcs[arc.id]);
    html += `
      <div class="tree-arc-group ${isCollapsed ? 'collapsed' : ''}">
        <button type="button" class="tree-arc-head" onclick="toggleArcCollapse('${arc.id}')">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${isCollapsed ? '▸' : '▾'} ${arc.name}</span>
          <span class="tree-arc-range">${arc.range}</span>
        </button>
        <div class="tree-ep-list">
          ${arcEps.map(ep => {
            const epNum = parseInt(ep.ep, 10);
            const isCur = epNum === parseInt(state.currentEp, 10);
            let badges = "";
            if (ep.update) badges += `<span class="update-badge" title="${ep.update.sceneCount} 场有改动">更新</span>`;
            else if (ep.hasFullScript) badges += `<span class="dot-tag-green" title="含分集剧本">本</span>`;
            if (ep.isKeySys) badges += `<span class="dot-tag-red" title="★关键对峙/高潮集">★</span>`;
            else if (ep.isLightSys) badges += `<span class="dot-tag-green" title="⚡黑道/情感暗线交锋">⚡</span>`;
            return `
              <button type="button" class="tree-ep-item ${isCur ? 'active' : ''}" data-tree-ep="${epNum}" onclick="selectEpisode(${epNum})">
                <span class="tei-num">EP${String(epNum).padStart(2, '0')}</span>
                <span class="tei-title">${ep.title}</span>
                <span class="tei-badges">${badges}</span>
              </button>
            `;
          }).join("")}
        </div>
      </div>
    `;
  }
  container.innerHTML = html;
}

function toggleArcCollapse(arcId) {
  state.collapsedArcs[arcId] = !state.collapsedArcs[arcId];
  renderEpisodeTree();

  `;
}

// --- Tab 2：📝 分场剧本（高密度同行对白 + 系统面板智能聚合 + 宿命闪回2x2网格；100%零篡改原文） ---
function classifyScriptLine(rawLine) {
  const raw = String(rawLine ?? "");
  const line = raw.trim();
  const original = { raw, text: raw };
  if (!line) return { ...original, type: "action" };
  if (line.startsWith("本场预算：")) return { ...original, type: "production_note" };

  // 1) 闪回/镜头画面标注行：
  if (line.startsWith("【画面】") || line.startsWith("△镜头闪回")) {
    return { ...original, type: "flashback" };
  }
  // 2) 屏幕字幕/画面文字/系统提示行：
  if ((line.startsWith("【") && line.endsWith("】")) || line.includes("字幕：") || line.includes("画面文字：") || line.includes("画面人物标识：")) {
    return { ...original, type: "sys_panel" };
  }
  // 3) 系统音（VO）：
  const sysVoMatch = line.match(/^系统音（VO）[：:]\s*(.*)$/);
  if (sysVoMatch) {
    return { ...original, type: "sys_vo" };
  }
  // 4) 角色对白或内心 OS
  const diagMatch = line.match(/^([^\s：:（(△]{1,10})((?:（[^）]+）|\(OS\)|OS|os)?)[：:]\s*(.+)$/);
  if (diagMatch) {
    const who = (diagMatch[1] || "").trim();
    const modifier = (diagMatch[2] || "").trim();
    const colonIndex = raw.search(/[：:]/);
    const slices = { speaker: raw.slice(0, colonIndex), body: raw.slice(colonIndex) };
    const isOs = modifier.includes("OS") || modifier.includes("os") || modifier.includes("旁白") || modifier.includes("内心") || who.includes("OS") || who.includes("内心");
    if (who.startsWith("林辰") && isOs) {
      return { ...original, ...slices, type: "os", who, modifier };
    }
    if (who === "林辰") {
      return { ...original, ...slices, type: "wusong", who, modifier };
    }
    return { ...original, ...slices, type: "normal_diag", who, modifier };
  }
  // 5) 判断是否为紧跟系统面板的简短面板过渡描述（以便与上下系统面板聚合成一张卡，不打断系统面板）
  const isSysBridge = (
    line.length <= 28 &&
    (line.includes("面板") || line.includes("系统框") || line.includes("系统提示音")) &&
    !line.includes("林辰（") && !line.includes("许总")
  );
  if (isSysBridge) {
    return { ...original, type: "sys_bridge" };
  }
  return { ...original, type: "action" };
}

function sourceText(raw) {
  return String(raw ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 将连续的系统信息行、连续的【画面】闪回行智能聚合成结构化块（不改动任何原文字符！）
function groupSceneBlocks(parsedLines) {
  const blocks = [];
  for (let i = 0; i < parsedLines.length; i++) {
    const item = parsedLines[i];
    const isSysItem = item.type === "sys_panel" || item.type === "sys_vo" || item.type === "sys_bridge";

    if (item.type === "flashback") {
      const last = blocks[blocks.length - 1];
      if (last && last.blockType === "flashback_group") {
        last.items.push(item);
      } else {
        blocks.push({ blockType: "flashback_group", items: [item] });
      }
      continue;
    }

    if (isSysItem) {
      // 如果只是孤立的一句 sys_bridge 且前后都不是 sys_panel/sys_vo，则退化为普通 action
      const prev = blocks[blocks.length - 1];
      const next = parsedLines[i + 1];
      const nextIsSys = next && (next.type === "sys_panel" || next.type === "sys_vo");
      const prevIsSys = prev && prev.blockType === "sys_hud_group";
      if (item.type === "sys_bridge" && !prevIsSys && !nextIsSys) {
        blocks.push({ blockType: "single", item: { ...item, type: "action" } });
        continue;
      }
      if (prevIsSys) {
        prev.items.push(item);
      } else {
        blocks.push({ blockType: "sys_hud_group", items: [item] });
      }
      continue;
    }

    blocks.push({ blockType: "single", item });
  }
  return blocks;
}

function renderScriptChange(edit, id, sceneSummary) {
  const side = (label, lines, fallback) => `<section class="script-change-side"><h4>${label}</h4>${lines.length ? lines.map(line => `<p>${sourceText(line)}</p>`).join('') : `<p>${fallback}</p>`}</section>`;
  return `<details class="script-change" id="${id}">
    <summary>${edit.kind} · 展开更新注释与新旧对比</summary>
    <p class="script-change-note">${sceneSummary ? `<strong>本场重点</strong> ${sourceText(sceneSummary)}<br>` : ''}${sourceText(edit.note)}</p>
    <div class="script-change-grid">
      ${side('旧稿', edit.before, '此处为新版新增')}
      ${side('新稿', edit.after, '此处已删减')}
    </div>
  </details>`;
}

}

            const updated = (block.item?.updated || block.items?.some(item => item.updated)) ? ' script-line-updated' : '';
            // 1) 预言/宿命幻象闪回 2×2 网格卡

            return `<div class="flow-action${updated}">${marker}<span data-source-line>${sourceText(item.raw)}</span></div>`;
          }).join("")}

      </article>

  return `

function inferCameraTag(shot) {
  const txt = (shot.label + " " + shot.desc).toLowerCase();
  if (txt.includes("特写") || txt.includes("瞳孔") || txt.includes("手指") || txt.includes("眼神")) return "ECU · 情绪特写";
  if (txt.includes("【游戏") || txt.includes("剑武士") || txt.includes("法阵") || txt.includes("光刃") || txt.includes("字幕")) return "VFX · 游戏实机/特效";
  if (txt.includes("要塞") || txt.includes("会场") || txt.includes("宴会厅") || txt.includes("网吧") || txt.includes("战场")) return "WS · 场景全景";
  if (txt.includes("斩") || txt.includes("拳") || txt.includes("摔") || txt.includes("突进") || txt.includes("撞")) return "ACT · 竞技/动作镜";
  return "MS · 叙事中景";
}

function renderCenterStage() {

  let badgesHtml = "";
  if (ep.hasFullScript) badgesHtml += `<span class="pill-green">🎬 已上传分集剧本（${(ep.scenes || []).length}场）</span>`;

  else if (ep.isLightSys) badgesHtml += `<span class="pill-green">⚡ 黑道/情感暗线</span>`;

  const sceneTabCountLabel = ep.hasFullScript ? `${(ep.scenes || []).length}场` : "待上传";

  const headEl = document.getElementById("stageStickyHead");
  headEl.innerHTML = `
    <div class="ssh-top-row">

  if (state.rightTab === rtab) return;

}

// 右栏 Tab 2：按场次展示剧本关键词估算和对应原文。
function buildRightTabEmotion(ep) {
  const epNum = parseInt(ep.ep, 10);
  const pts = ep.emotionCurve || [];
  const MW = 320, MH = 80;
  const curMacro = MACRO_COORDS[epNum - 1] || MACRO_COORDS[0] || { x: 12, y: 40 };

  let singleEpCurveBox = "";
  if (ep.hasFullScript && pts.length > 0) {
    const W = 320, H = 104, padX = 36, padY = 20;
    const epCoords = pts.map((p, i) => {
      const x = pts.length === 1 ? W / 2 : padX + (i / (pts.length - 1)) * (W - padX * 2);
      const norm = (p.score + 100) / 200;
      const y = (H - padY) - norm * (H - padY * 2);
      return { ...p, x: Math.round(x), y: Math.round(y) };
    });

    const epPolyline = epCoords.map(c => `${c.x},${c.y}`).join(" ");
    const epArea = epCoords.length > 1
      ? `M ${epCoords[0].x},${H - padY} L ` + epCoords.map(c => `${c.x},${c.y}`).join(" L ") + ` L ${epCoords[epCoords.length - 1].x},${H - padY} Z`
      : "";

    singleEpCurveBox = `
      <div class="curve-sub-box">
        <div class="csb-label">
          <span>① 本集剧本情绪起伏曲线（EP${String(epNum).padStart(2, '0')} · 共${pts.length}个剧本节点）</span>
          <span class="pill-green" style="font-size:9.5px;padding:1px 5px">关键词估算</span>
        </div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:104px;display:block">
          <line x1="${padX - 10}" y1="${H / 2}" x2="${W - padX + 10}" y2="${H / 2}" stroke="#D1D5DB" stroke-dasharray="3,3" stroke-width="1" />
          ${epArea ? `<path d="${epArea}" fill="rgba(22, 163, 74, 0.1)" />` : ""}
          ${epCoords.length > 1 ? `<polyline fill="none" stroke="#111827" stroke-width="2" points="${epPolyline}" />` : ""}
          ${epCoords.map((c, idx) => {
            const isRed = c.score < 0 || c.score >= 85;
            const dotColor = isRed ? "#DC2626" : "#15803D";
            const isFirst = idx === 0 && epCoords.length > 1;
            const isLast = idx === epCoords.length - 1 && epCoords.length > 1;
            const anchor = isFirst ? "start" : (isLast ? "end" : "middle");
            const textX = isFirst ? Math.max(4, c.x - 10) : (isLast ? Math.min(W - 4, c.x + 10) : c.x);
            const textY = c.y < 24 ? c.y + 15 : c.y - 7;
            return `
              <g style="cursor:pointer" onclick="jumpToSceneFromCurve(${c.sceneNum})">
                <circle cx="${c.x}" cy="${c.y}" r="4.5" fill="${dotColor}" stroke="#FFFFFF" stroke-width="1.5" />
                <text x="${textX}" y="${textY}" text-anchor="${anchor}" font-size="9.5" font-weight="700" fill="${dotColor}">${c.tag}</text>
                <text x="${c.x}" y="${H - 3}" text-anchor="middle" font-size="8.5" fill="#6B7280">${c.label}</text>
              </g>
            `;
          }).join("")}
        </svg>

        <!-- 逐节点展示来自本集真实剧本的情绪分析依据 -->
        <div class="emotion-reason-list">
          ${pts.map(p => {
            const isRed = p.score < 0 || p.score >= 85;
            const signScore = p.score > 0 ? `+${p.score}` : String(p.score);
            return `
              <div class="emotion-reason-item ${isRed ? 'is-red' : ''}" onclick="jumpToSceneFromCurve(${p.sceneNum})" title="点击定位到对应剧本场次">
                <div style="display:flex;align-items:center;justify-content:space-between;font-weight:800;color:var(--ink);margin-bottom:2px">
                  <span>${p.label}（${p.subLabel || ''}）· ${p.tag}</span>
                  <span style="font-family:var(--font-mono);color:${isRed ? 'var(--red)' : 'var(--green)'}">${signScore}</span>
                </div>
                <div>${p.reason || ''}</div>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;
  } else {
    // 仅有大纲的集显示全季曲线。
    singleEpCurveBox = `
      <div class="curve-sub-box" style="background:#FFFFFF;border-left:3.5px solid var(--ink)">
        <div class="csb-label">
          <span>① 本集剧本情绪起伏曲线（EP${String(epNum).padStart(2, '0')}）</span>
          <span class="pill-gray" style="font-size:10px;padding:1px 6px">分集剧本待上传</span>
        </div>
        <p style="font-size:12px;color:var(--ink-2);line-height:1.65;margin-bottom:8px">
          EP31—65 目前提供大纲节奏。EP01—30 可查看分场剧本的情绪估算及对应原文。
        </p>
        <button type="button" class="ep-step-btn" style="font-size:11px;padding:4px 9px" onclick="selectEpisode(30)">
          📈 查看 EP30 的分场情绪参考
        </button>
      </div>
    `;
  }

  return `
    <div class="asset-box">
      <div class="ab-head">
        <span class="ab-title">📈 剧本情绪曲线 & 65集宏观节奏</span>
        <span class="pill-red" style="font-size:10px;padding:1px 6px">交锋热度 ${ep.macroEmotionScore || 80}</span>
      </div>

      ${singleEpCurveBox}

      <!-- 下图：预计算缓存的 80 集全集集纲宏观爽点曲线 -->
      <div class="curve-sub-box">
        <div class="csb-label">
          <span>② 全季 65 集大纲爽点曲线（当前：EP${String(epNum).padStart(2, '0')}）</span>
          <span style="font-size:10px;color:var(--red)">● 红点=18集关键对峙</span>
        </div>
        <svg viewBox="0 0 ${MW} ${MH}" style="width:100%;height:80px;display:block">
          <polyline fill="none" stroke="#9CA3AF" stroke-width="1.3" points="${MACRO_POLYLINE}" />
          ${MACRO_KEY_DOTS_HTML}
          <line x1="${curMacro.x}" y1="4" x2="${curMacro.x}" y2="${MH - 12}" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="2,2" />
          <circle cx="${curMacro.x}" cy="${curMacro.y}" r="5" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5" />
          <text x="12" y="${MH - 2}" font-size="8.5" fill="#6B7280">EP01 第一幕</text>
          <text x="${MW / 2}" y="${MH - 2}" text-anchor="middle" font-size="8.5" fill="#6B7280">EP36 元老拿股</text>
          <text x="${MW - 12}" y="${MH - 2}" text-anchor="end" font-size="8.5" fill="#6B7280">EP65 帝国登顶</text>
        </svg>
      </div>
    </div>
  `;
}

// --- 右栏 Tab 3：👥 出场人物谱（人物 / 出场次数 / 人物本集作用） ---

function renderRightInspector() {
  const ep = getEpObj(state.currentEp);
  if (!ep) return;
  const bodyEl = document.getElementById("rightTabBody");
  if (!bodyEl) return;

  if (state.rightTab === "emotion") {
    bodyEl.innerHTML = buildRightTabEmotion(ep);
  } else if (state.rightTab === "chars") {
    bodyEl.innerHTML = buildRightTabChars(ep);
  } else {
    bodyEl.innerHTML = buildRightTabCard(ep);
  }
}

function switchInspectorCard(idx) {
  state.activeCardIdx = idx;
  renderRightInspector();
}

function jumpToSceneFromCurve(sceneNum) {
  if (state.centerTab !== "script" || state.scriptTrackFilter !== "all") {
    state.centerTab = "script";
    state.scriptTrackFilter = "all";
    renderCenterStage();
  }
  scrollToSceneCard(sceneNum);
}

// ============ 交互控制函数 ============
let episodeScrollFrame = 0;
function selectEpisode(epNum, forceFullTreeRender = false) {
  epNum = Number(epNum);
  if (!Number.isInteger(epNum) || epNum < 1 || epNum > 65) return;
  if (state.mode !== "studio") switchMode("studio");
  state.currentEp = epNum;
  state.activeSceneNum = null;
  state.activeCardIdx = 0;

  const ep = getEpObj(epNum);
  let needTreeRebuild = forceFullTreeRender;
  if (ep && !matchesFilter(ep)) {
    clearTimeout(searchDebounceTimer);
    state.chapter = "all";
    state.arcFilter = "all";
    state.sysFilter = "all";
    state.search = "";
    document.getElementById("globalSearchInput").value = "";
    document.getElementById("gsClearBtn").style.display = "none";
    document.querySelectorAll(".sys-filter-btn").forEach(b => b.classList.toggle("active", b.dataset.sysfilter === "all"));
    needTreeRebuild = true;
  }
  if (ep && state.collapsedArcs[ep.arc]) {
    state.collapsedArcs[ep.arc] = false;
    needTreeRebuild = true;
  }

  updateTopHud();
  if (needTreeRebuild) {
    renderEcgRibbon();
    renderEpisodeTree();
  } else {
    updateActiveEpisodeHighlight(epNum);
  }
  renderCenterStage();
  renderRightInspector();

  document.getElementById("stageBody").scrollTop = 0;
  document.getElementById("rightTabBody").scrollTop = 0;
  cancelAnimationFrame(episodeScrollFrame);
  episodeScrollFrame = requestAnimationFrame(() => {
    const activeTreeBtn = document.querySelector('[data-tree-ep="' + epNum + '"]');
    const tree = document.getElementById("episodeTreeContainer");
    if (activeTreeBtn) {
      const r = activeTreeBtn.getBoundingClientRect(), t = tree.getBoundingClientRect();
      if (r.top < t.top) tree.scrollTop += r.top - t.top;
      else if (r.bottom > t.bottom) tree.scrollTop += r.bottom - t.bottom;
    }
  });
}

function scrollToSceneCard(sceneNum) {
  state.activeSceneNum = sceneNum;
  const id = `scene-block-${sceneNum}`;
  let el = document.getElementById(id);

    setScriptTrackFilter("all");
    el = document.getElementById(id);
  }
  document.querySelectorAll("[data-scene-jump]").forEach(button => {
    const active = Number(button.dataset.sceneJump) === sceneNum;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
  if (el && typeof el.scrollIntoView === "function") {
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

  searchDebounceTimer = setTimeout(() => {

let modalTrigger = null;
let savedBodyOverflow = "";
function openModal() {
  closeAllDropdowns();
  modalTrigger = document.activeElement;
  savedBodyOverflow = document.body.style.overflow;
  document.body.style.overflow = "hidden";
  document.querySelector(".app-shell").inert = true;
  const modal = document.getElementById("modal");
  modal.setAttribute("role", "dialog");
  modal.setAttribute("aria-modal", "true");
  modal.setAttribute("aria-label", modal.querySelector("h2")?.textContent || "详情");
  document.getElementById("modalMask").classList.add("show");
  modal.scrollTop = 0;
  modal.querySelector("button")?.focus();
}
function closeModal() {
  const mask = document.getElementById("modalMask");
  if (!mask.classList.contains("show")) return;
  mask.classList.remove("show");
  document.querySelector(".app-shell").inert = false;
  document.body.style.overflow = savedBodyOverflow;
  if (modalTrigger?.isConnected) modalTrigger.focus({ preventScroll: true });
}

function switchMode(mode) {
  state.mode = mode;
  closeAllDropdowns();
  document.querySelectorAll(".mode-tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.mode === mode);
  });
  document.getElementById("studioView").classList.toggle("show", mode === "studio");
  document.getElementById("cardsView").classList.toggle("show", mode === "cards");
  document.getElementById("sandboxView").classList.toggle("show", mode === "sandbox");
  document.getElementById("originalView").classList.toggle("show", mode === "original");

  if (mode === "cards" && !document.getElementById("albumContainer").hasChildNodes()) renderCardsAlbumView();
  else if (mode === "sandbox" && !document.getElementById("sandboxContainer").hasChildNodes()) renderSandboxView();
  else if (mode === "original") renderOrigContent();
}

// 点击页面空白处关闭自定义下拉菜单
document.addEventListener("click", () => {
  if (state.openDropdown) closeAllDropdowns();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closeAllDropdowns(true);
    closeModal();
    return;
  }
  if (document.getElementById("modalMask").classList.contains("show")) {
    if (e.key === "Tab") {
      const items = [...document.querySelectorAll('#modal button, #modal a[href], #modal [tabindex="0"]')];
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  if (state.openDropdown && ["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) {
    e.preventDefault();
    const items = [...document.querySelectorAll('#' + state.openDropdown + 'DdMenu button')];
    const i = items.indexOf(document.activeElement);
    const next = e.key === "Home" ? 0 : e.key === "End" ? items.length - 1 : (i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items[next]?.focus();
    return;
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"]:not(button)')) {
    e.preventDefault(); e.target.click(); return;
  }
  const target = e.target;
  if (target.closest('input, textarea, select, [contenteditable="true"]') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (state.mode === "studio" && !state.openDropdown && (target === document.body || target.closest("#episodeTreeContainer"))) {
    const direction = ["ArrowDown", "j", "J"].includes(e.key) ? 1 : ["ArrowUp", "k", "K"].includes(e.key) ? -1 : 0;
    if (direction) {
      e.preventDefault();
      const visible = EPISODES.filter(matchesFilter);
      const i = visible.findIndex(ep => Number(ep.ep) === Number(state.currentEp));
      const next = visible[i < 0 ? 0 : i + direction];
      if (next) {
        selectEpisode(Number(next.ep));
        document.querySelector('[data-tree-ep="' + next.ep + '"]')?.focus({ preventScroll: true });
      }
    }
  }
});

// 启动应用
refreshMergedData();
